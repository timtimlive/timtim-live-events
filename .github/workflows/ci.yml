name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, build, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain (vitest 4, eslint 9, vite 8, next 16) needs Node 20.19+.
        # Node 18 support of the BUILT packages is checked by the node18-runtime job below.
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Generated types match the contract
        run: npm run check:generated
      - name: Integration tests (live keyless demo endpoint)
        run: npm run test:integration

  node18-runtime:
    name: Built SDK runs on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      - name: Smoke test the built packages on Node 18
        run: node --version && node scripts/smoke-dist.mjs

  examples:
    name: Examples build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Node example (keyless demo)
        run: npm run example:node
      - name: React (Vite) example
        run: npm run build -w examples-react
      - name: Next.js example
        run: npm run build -w examples-nextjs
